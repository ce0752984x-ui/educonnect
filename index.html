<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ÉduConnect — Inscriptions 6e</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1D3557;--ink-l:#2E5077;--ink-soft:#E7ECF3;
  --amber:#E08E45;--amber-soft:#FBE9D6;
  --ok:#3F7A5C;--ok-bg:#E5F2EB;
  --err:#B5453F;--err-bg:#FBEAE8;
  --bg:#F4F6F9;--surface:#fff;
  --border:#DCE3EB;--muted:#6B7280;--text:#1F2937;
  --r:10px;--sh:0 2px 10px rgba(29,53,87,.07);
  --fd:'Fraunces',serif;--fb:'Public Sans',system-ui,sans-serif;--fm:'IBM Plex Mono',monospace;
}
*{box-sizing:border-box;} html,body{margin:0;padding:0;}
body{font-family:var(--fb);color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;}
h1,h2,h3,h4{font-family:var(--fd);font-weight:600;margin:0 0 .5rem;color:var(--ink);letter-spacing:-.01em;}
p{margin:0 0 .75rem;line-height:1.55;} a{color:var(--ink-l);}
.container{max-width:1080px;margin:0 auto;padding:0 1.5rem;}
button{font-family:inherit;cursor:pointer;}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px;}
/* Boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;border:1px solid transparent;border-radius:8px;padding:.65rem 1.2rem;font-size:.95rem;font-weight:600;background:var(--ink);color:#fff;transition:transform .08s,background .15s;}
.btn:hover{background:var(--ink-l);} .btn:active{transform:scale(.98);}
.btn-accent{background:var(--amber);} .btn-accent:hover{background:#cc7a32;}
.btn-outline{background:transparent;color:var(--ink);border-color:var(--border);} .btn-outline:hover{background:var(--ink-soft);}
.btn-ok{background:var(--ok);} .btn-ok:hover{background:#2f5c44;}
.btn-danger{background:transparent;color:var(--err);border-color:var(--err-bg);} .btn-danger:hover{background:var(--err-bg);}
.btn-sm{padding:.4rem .8rem;font-size:.82rem;} .btn-block{width:100%;}
.btn[disabled]{opacity:.45;cursor:not-allowed;pointer-events:none;}
/* Formulaires */
label{display:block;font-size:.82rem;font-weight:600;color:var(--ink);margin-bottom:.3rem;}
input,select,textarea{width:100%;font-family:inherit;font-size:.95rem;color:var(--text);border:1px solid var(--border);border-radius:8px;padding:.6rem .75rem;background:#fff;}
input:focus,select:focus,textarea:focus{border-color:var(--ink-l);outline:none;}
textarea{resize:vertical;min-height:80px;}
.field{margin-bottom:1rem;} .field-row{display:grid;grid-template-columns:repeat(2,1fr);gap:1rem;}
.field-row-3{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;}
fieldset{border:1px solid var(--border);border-radius:var(--r);padding:1.25rem;margin:0 0 1.25rem;}
legend{font-family:var(--fd);font-weight:600;color:var(--ink);padding:0 .4rem;font-size:1.05rem;}
.hint{font-size:.8rem;color:var(--muted);margin-top:.2rem;}
.required-star{color:var(--amber);margin-left:2px;}
/* Sceau SVG */
.seal{display:block;flex-shrink:0;}
/* Statut pills */
.pill{font-family:var(--fm);font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;padding:.25rem .65rem;border-radius:999px;font-weight:600;display:inline-block;}
.pill.pending{background:var(--amber-soft);color:#a35a14;}
.pill.accepted{background:var(--ok-bg);color:var(--ok);}
.pill.refused{background:var(--err-bg);color:var(--err);}
.pill.approved{background:var(--ok-bg);color:var(--ok);}
.pill.rejected{background:var(--err-bg);color:var(--err);}
/* Stamp */
.stamp{display:inline-flex;align-items:center;gap:.5rem;font-family:var(--fm);text-transform:uppercase;letter-spacing:.1em;font-size:.78rem;font-weight:500;border:2px solid currentColor;border-radius:999px;padding:.45rem 1rem;transform:rotate(-1.5deg);}
.stamp .dot{width:8px;height:8px;border-radius:50%;background:currentColor;}
.stamp.open{color:var(--ok);} .stamp.closed{color:var(--err);}
/* Login */
.login-page{min-height:100vh;display:grid;grid-template-columns:1.05fr 1fr;}
.login-left{background:linear-gradient(165deg,var(--ink) 0%,#122a45 100%);color:#fff;display:flex;flex-direction:column;justify-content:space-between;padding:3rem;position:relative;overflow:hidden;}
.login-left::before{content:"";position:absolute;right:-100px;top:-100px;width:320px;height:320px;border:1px solid rgba(255,255,255,.08);border-radius:50%;}
.login-left::after{content:"";position:absolute;right:-40px;top:-40px;width:320px;height:320px;border:1px solid rgba(255,255,255,.05);border-radius:50%;}
.login-left-top{display:flex;align-items:center;gap:.9rem;}
.login-left-top .sname{font-family:var(--fd);font-size:1.1rem;line-height:1.25;}
.login-left-top .sname small{display:block;font-family:var(--fm);font-size:.68rem;letter-spacing:.12em;color:#f3c892;text-transform:uppercase;}
.login-tagline{font-family:var(--fd);font-size:2rem;line-height:1.25;font-weight:500;max-width:22ch;position:relative;z-index:1;}
.login-tagline em{color:var(--amber);font-style:normal;}
.login-right{display:flex;align-items:center;justify-content:center;padding:2.5rem;}
.login-card{width:100%;max-width:440px;}
.login-tabs{display:flex;gap:.5rem;margin-bottom:1.5rem;border-bottom:1px solid var(--border);}
.login-tab{background:none;border:none;padding:.7rem .2rem;margin-right:1.2rem;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;font-size:.92rem;}
.login-tab.active{color:var(--ink);border-bottom-color:var(--amber);}
.error-box{background:var(--err-bg);color:var(--err);border-radius:8px;padding:.6rem .9rem;font-size:.85rem;margin-bottom:1rem;font-weight:600;}
.success-box{background:var(--ok-bg);color:var(--ok);border-radius:8px;padding:.6rem .9rem;font-size:.85rem;margin-bottom:1rem;font-weight:600;}
/* Topbar */
.topbar{background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20;}
.topbar-inner{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.85rem 0;}
.brand{display:flex;align-items:center;gap:.7rem;}
.brand .sname{font-family:var(--fd);font-weight:600;font-size:1rem;line-height:1.2;color:var(--ink);}
.brand .sname small{display:block;font-family:var(--fm);font-size:.63rem;letter-spacing:.14em;color:var(--amber);text-transform:uppercase;}
.nav-d{display:flex;gap:.2rem;}
.nav-d button{background:none;border:none;padding:.55rem .9rem;border-radius:8px;font-size:.9rem;font-weight:600;color:var(--muted);}
.nav-d button:hover{background:var(--ink-soft);color:var(--ink);}
.nav-d button.active{color:var(--ink);background:var(--ink-soft);}
.topbar-r{display:flex;align-items:center;gap:.75rem;}
.user-pill{display:flex;align-items:center;gap:.45rem;font-size:.85rem;font-weight:600;color:var(--ink);background:var(--ink-soft);padding:.4rem .8rem;border-radius:999px;}
.role-tag{font-family:var(--fm);font-size:.65rem;text-transform:uppercase;letter-spacing:.08em;color:var(--amber);background:rgba(224,142,69,.15);padding:.1rem .4rem;border-radius:4px;}
.hamburger{display:none;background:none;border:1px solid var(--border);border-radius:8px;padding:.45rem .6rem;font-size:1.1rem;line-height:1;}
.mob-nav{display:none;border-top:1px solid var(--border);padding:.5rem 0;}
.mob-nav.open{display:flex;flex-direction:column;}
.mob-nav button{text-align:left;background:none;border:none;padding:.75rem 0;font-size:1rem;font-weight:600;color:var(--muted);border-bottom:1px solid var(--border);}
.mob-nav button.active{color:var(--ink);} .mob-nav button:last-child{border:none;}
/* Layout */
main.container{padding-top:2rem;padding-bottom:3rem;}
.page-head{margin-bottom:1.5rem;}
.page-head .eyebrow{font-family:var(--fm);text-transform:uppercase;letter-spacing:.14em;font-size:.72rem;color:var(--amber);font-weight:600;margin-bottom:.35rem;display:block;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:1.5rem;box-shadow:var(--sh);}
.card+.card{margin-top:1.25rem;}
.grid-2{display:grid;grid-template-columns:2fr 1fr;gap:1.25rem;align-items:start;}
/* Stepper */
.stepper{display:flex;align-items:center;gap:0;margin-bottom:2rem;overflow-x:auto;padding-bottom:.5rem;}
.step-item{display:flex;align-items:center;gap:0;flex-shrink:0;}
.step-circle{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--fm);font-size:.8rem;font-weight:600;border:2px solid var(--border);background:#fff;color:var(--muted);flex-shrink:0;}
.step-circle.done{background:var(--ok);border-color:var(--ok);color:#fff;}
.step-circle.active{background:var(--ink);border-color:var(--ink);color:#fff;}
.step-label{font-size:.75rem;font-weight:600;color:var(--muted);margin-left:.4rem;white-space:nowrap;}
.step-label.active{color:var(--ink);}
.step-line{flex:1;height:2px;background:var(--border);min-width:20px;max-width:50px;}
.step-line.done{background:var(--ok);}
/* Inscription recap */
.recap-section{margin-bottom:1.25rem;}
.recap-section h4{font-size:.9rem;font-family:var(--fm);text-transform:uppercase;letter-spacing:.08em;color:var(--amber);margin-bottom:.6rem;}
.recap-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:.4rem 1.5rem;}
.recap-grid dt{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0;}
.recap-grid dd{margin:.1rem 0 .75rem;font-family:var(--fm);font-size:.85rem;word-break:break-word;}
/* Actualités */
.news-item{padding:1.25rem 0;border-bottom:1px solid var(--border);}
.news-item:last-child{border-bottom:none;}
.news-meta{font-family:var(--fm);font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:.35rem;}
.news-content{white-space:pre-wrap;color:var(--text);line-height:1.6;}
.news-actions{margin-top:.75rem;display:flex;gap:.5rem;}
/* Admin tabs */
.admin-tabs{display:flex;gap:.5rem;margin-bottom:1.5rem;flex-wrap:wrap;border-bottom:1px solid var(--border);}
.admin-tabs button{background:none;border:none;padding:.7rem .2rem;margin-right:1.2rem;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;font-size:.92rem;}
.admin-tabs button.active{color:var(--ink);border-bottom-color:var(--amber);}
/* Comptes */
.account-card{border:1px solid var(--border);border-radius:var(--r);padding:1rem 1.25rem;margin-bottom:.75rem;background:#fff;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.75rem;}
.account-info h4{margin:0 0 .2rem;font-size:1rem;}
.account-info .email{font-family:var(--fm);font-size:.78rem;color:var(--muted);}
.account-actions{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;}
/* Dossiers */
.reg-card{border:1px solid var(--border);border-radius:var(--r);padding:1.1rem 1.25rem;margin-bottom:1rem;background:#fff;}
.reg-card-header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:.75rem;}
.reg-ref{font-family:var(--fm);font-size:.78rem;color:var(--muted);}
.reg-controls{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;}
.reg-controls select{width:auto;}
/* Champs personnalisés */
.custom-field-card{border:1px solid var(--border);border-radius:var(--r);padding:1rem 1.25rem;margin-bottom:.75rem;background:#fff;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.75rem;}
.cf-info .cf-type{font-family:var(--fm);font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;}
/* Filtres */
.filter-bar{display:flex;gap:.75rem;align-items:center;flex-wrap:wrap;margin-bottom:1.25rem;}
.filter-bar input{flex:1;min-width:160px;}
.filter-bar select{width:auto;}
/* Suivi */
.suivi-box{background:var(--ink-soft);border-radius:var(--r);padding:1.5rem;margin-bottom:1.5rem;}
.suivi-row{display:flex;gap:.75rem;align-items:flex-end;flex-wrap:wrap;}
.suivi-row .field{flex:1;min-width:180px;margin:0;}
.suivi-result{margin-top:1rem;border-radius:var(--r);padding:1.1rem 1.25rem;border:1px solid var(--border);background:#fff;}
.suivi-result.not-found{background:var(--err-bg);border-color:transparent;color:var(--err);}
/* Confirmation */
.confirm-box{text-align:center;padding:2rem 1rem;}
.confirm-ref{display:inline-block;font-family:var(--fm);font-size:1.4rem;letter-spacing:.08em;border:2px dashed var(--amber);padding:.6rem 1.4rem;border-radius:8px;margin:1rem 0;color:var(--ink);transform:rotate(-1deg);}
/* Toggle */
.toggle-row{display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;}
.switch{position:relative;width:50px;height:28px;border-radius:999px;background:var(--border);border:none;flex-shrink:0;transition:background .15s;}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 3px rgba(0,0,0,.25);}
.switch.on{background:var(--ok);} .switch.on::after{transform:translateX(22px);}
/* Toast */
.toast{position:fixed;bottom:1.25rem;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:.7rem 1.3rem;border-radius:999px;font-size:.88rem;font-weight:600;box-shadow:0 6px 24px rgba(0,0,0,.18);z-index:50;}
.toast.error{background:var(--err);} .toast.success{background:var(--ok);}
/* Empty */
.empty-state{text-align:center;padding:2.5rem 1rem;color:var(--muted);}
/* Upload area */
.upload-area{border:2px dashed var(--border);border-radius:var(--r);padding:1.5rem;text-align:center;background:var(--bg);cursor:pointer;transition:border-color .15s;}
.upload-area:hover{border-color:var(--amber);}
.upload-area input[type=file]{display:none;}
.upload-area label{cursor:pointer;font-weight:600;color:var(--ink-l);}
.file-list{margin-top:.75rem;}
.file-item{display:flex;align-items:center;justify-content:space-between;padding:.4rem .75rem;background:var(--ink-soft);border-radius:6px;font-size:.85rem;margin-top:.4rem;font-family:var(--fm);}
.file-item button{background:none;border:none;color:var(--err);font-size:1rem;padding:0 .2rem;line-height:1;}
/* Badge compte */
.badge-pending{background:var(--amber-soft);color:#a35a14;border-radius:999px;font-family:var(--fm);font-size:.7rem;padding:.15rem .55rem;font-weight:600;}
/* Footer */
footer{border-top:1px solid var(--border);padding:1.5rem 0;color:var(--muted);font-size:.82rem;}
footer .container{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.5rem;}
/* Responsive */
@media(max-width:860px){
  .login-page{grid-template-columns:1fr;}
  .login-left{padding:2rem;min-height:220px;}
  .login-tagline{font-size:1.5rem;}
  .login-right{padding:1.5rem;}
  .nav-d{display:none;} .hamburger{display:inline-flex;align-items:center;}
  .field-row,.field-row-3{grid-template-columns:1fr;}
  .grid-2{grid-template-columns:1fr;}
  main.container{padding-top:1.25rem;}
  .stepper{gap:0;}
  .step-label{display:none;}
}
@media(max-width:480px){
  .container{padding:0 1rem;} .card{padding:1.1rem;}
  .topbar-r .user-pill .full-name{display:none;}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
// ================================================================
// ÉduConnect Collège v2 — localStorage (GitHub Pages compatible)
// ================================================================

// ---------- Storage ----------
const DB = {
  get(key, fallback) {
    try {
      const v = localStorage.getItem('edu2_' + key);
      return v !== null ? JSON.parse(v) : (fallback !== undefined ? fallback : null);
    } catch(e) { return fallback !== undefined ? fallback : null; }
  },
  set(key, value) {
    try { localStorage.setItem('edu2_' + key, JSON.stringify(value)); return true; }
    catch(e) { return false; }
  },
  del(key) { try { localStorage.removeItem('edu2_' + key); } catch(e) {} }
};

// ---------- Defaults ----------
const DEFS = {
  config: { schoolName: 'Collège Jean Moulin', anneeScolaire: '2026-2027', adminPassword: 'admin2026', city: 'Paris' },
  status: { open: true, message: "Les inscriptions seront bientôt ouvertes. Consultez la rubrique Actualités pour plus d'informations." },
  news: [{ id:'n1', title:"Ouverture des inscriptions en ligne pour la rentrée 2026-2027", author:'Administration', date:new Date().toISOString(), content:"Bienvenue sur l'espace numérique du collège. Les familles dont l'enfant est actuellement en CM2 peuvent dès maintenant créer leur compte et déposer un dossier d'inscription pour la classe de 6e.\n\nVotre dossier sera examiné par notre équipe et vous serez informé de la décision par votre espace en ligne." }],
  registrations: [],
  accounts: [],
  customFields: []
};

// ---------- State ----------
let S = {
  page: 'login',
  appPage: 'accueil',
  adminTab: 'comptes',
  loginTab: 'famille',
  loginError: '',
  signupError: '',
  signupDone: false,
  session: null,
  mobNav: false,
  toast: null,
  inscStep: 1,
  inscData: {},
  inscFiles: {},
  inscConfirm: null,
  suiviRef: '',
  suiviResult: null,
  filterSt: 'tous',
  filterQ: '',
  editNewsId: null,
  editFieldId: null,
  newFieldDraft: null,
  config: structuredClone(DEFS.config),
  status: structuredClone(DEFS.status),
  news: structuredClone(DEFS.news),
  registrations: structuredClone(DEFS.registrations),
  accounts: structuredClone(DEFS.accounts),
  customFields: structuredClone(DEFS.customFields)
};

function init() {
  S.config = DB.get('config', DEFS.config);
  S.status = DB.get('status', DEFS.status);
  S.news = DB.get('news', DEFS.news);
  S.registrations = DB.get('registrations', DEFS.registrations);
  S.accounts = DB.get('accounts', DEFS.accounts);
  S.customFields = DB.get('customFields', DEFS.customFields);
  const sess = DB.get('session', null);
  if(sess) { S.session = sess; S.page = 'app'; }
  render();
}

// ---------- Utilities ----------
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fd(iso) {
  if(!iso) return '';
  try { return new Date(iso).toLocaleDateString('fr-FR', {day:'2-digit',month:'long',year:'numeric'}); } catch(e){ return ''; }
}
function genId(p){ return p+'-'+Date.now()+'-'+Math.random().toString(36).slice(2,5); }
function genRef(){ const y=(S.config.anneeScolaire||'2026-2027').split('-')[0]; return 'INS-'+y+'-'+Math.random().toString(36).slice(2,6).toUpperCase(); }
function initials(name){
  const stop=['college','collège','de','du','des','le','la','les','et'];
  const ws=(name||'').trim().split(/\s+/).filter(w=>w&&!stop.includes(w.toLowerCase()));
  let s=ws.slice(0,2).map(w=>w[0].toUpperCase()).join('');
  return s||'CE';
}
function toast(msg, type){ S.toast={msg,type:type||'info'}; render(); setTimeout(()=>{S.toast=null;render();},3000); }
function stClass(st){ if(st==='Acceptée'||st==='approved')return'accepted'; if(st==='Refusée'||st==='rejected')return'refused'; return'pending'; }
function stLabel(st){ if(st==='approved')return'Approuvé'; if(st==='rejected')return'Refusé'; return'En attente'; }
function save(key){ DB.set(key, S[key]); }
function hashPw(pw){ let h=0; for(let i=0;i<pw.length;i++){h=((h<<5)-h)+pw.charCodeAt(i);h|=0;} return 'h'+Math.abs(h).toString(16); }

// ---------- Seal SVG ----------
function seal(size, dark){
  const in2=initials(S.config.schoolName);
  const ring=dark?'#F3C892':'#E08E45';
  const bg=dark?'#fff':'#1D3557';
  const txt=dark?'#1D3557':'#fff';
  return `<svg class="seal" width="${size}" height="${size}" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
    <circle cx="32" cy="32" r="30" fill="${bg}"/>
    <circle cx="32" cy="32" r="30" fill="none" stroke="${ring}" stroke-width="1.5" stroke-dasharray="2 4"/>
    <circle cx="32" cy="32" r="24" fill="none" stroke="${ring}" stroke-width="1"/>
    <text x="32" y="40" text-anchor="middle" font-family="Fraunces,serif" font-size="22" font-weight="700" fill="${txt}">${esc(in2)}</text>
  </svg>`;
}

// ==========================================================
// RENDER LOGIN
// ==========================================================
function renderLogin(){
  const open = S.status.open;
  const familleForm = `
    <form id="f-login-famille" novalidate>
      <div class="field"><label>Adresse e-mail</label><input type="email" name="email" required placeholder="prenom.nom@email.fr" autocomplete="email"></div>
      <div class="field"><label>Mot de passe</label><input type="password" name="password" required autocomplete="current-password"></div>
      <button type="submit" class="btn btn-accent btn-block">Se connecter</button>
      <p style="text-align:center;margin-top:1rem;font-size:.88rem;color:var(--muted);">Pas encore de compte ? <button type="button" class="btn-link" data-action="goto-signup" style="background:none;border:none;color:var(--ink-l);font-weight:600;cursor:pointer;font-size:.88rem;">Créer un compte famille</button></p>
    </form>`;
  const adminForm = `
    <form id="f-login-admin" novalidate>
      <div class="field"><label>Identifiant</label><input type="text" name="nom" required placeholder="Administration" autocomplete="username"></div>

function renderActualites(){
  const isAdmin = S.session.role === 'admin';
  const sorted = [...S.news].sort((a,b)=>new Date(b.date)-new Date(a.date));
  let formHtml = '';
  if(isAdmin && S.editNewsId !== null){
    const isNew = S.editNewsId === 'new';
    const item = isNew ? null : S.news.find(n=>n.id===S.editNewsId);
    formHtml = `<div class="card" style="margin-bottom:1.25rem;">
      <h2>${isNew?"Publier une actualité":"Modifier l'actualité"}</h2>
      <form id="f-news" data-id="${esc(isNew?'':item.id)}">
        <div class="field"><label>Titre</label><input type="text" name="title" required value="${esc(isNew?'':item.title)}"></div>
        <div class="field"><label>Auteur</label><input type="text" name="author" required value="${esc(isNew?S.session.prenom+' '+S.session.nom:item.author)}"></div>
        <div class="field"><label>Contenu</label><textarea name="content" rows="6" required>${esc(isNew?'':item.content)}</textarea></div>
        <div style="display:flex;gap:.6rem;">
          <button type="submit" class="btn btn-accent">${isNew?'Publier':'Enregistrer'}</button>
          <button type="button" class="btn btn-outline" data-action="cancel-news">Annuler</button>
        </div>
      </form>
    </div>`;
  }
  const listHtml = sorted.length ? sorted.map(n=>`
    <div class="news-item">
      <div class="news-meta">${fd(n.date)} · ${esc(n.author)}</div>
      <h3>${esc(n.title)}</h3>
      <div class="news-content">${esc(n.content)}</div>

    ${isAdmin&&S.editNewsId===null?`<button class="btn btn-accent" data-action="new-news" style="margin-top:.5rem;">+ Publier une actualité</button>`:''}
  </div>
  ${formHtml}
  <div class="card">${listHtml}</div>`;
}

// ==========================================================
const STEPS = ['Responsable 1','Responsable 2','Élève','Scolarité & Options','Santé & Documents'];
function getStepsWithCustom(){
  const base = [...STEPS];
  if(S.customFields.length > 0) base.push('Documents complémentaires');
  base.push('Récapitulatif');
  return base;
}

function renderInscriptions(){
  const cfg = S.config;
  if(!S.status.open){
    return `
    <div class="page-head"><span class="eyebrow">Inscriptions ${esc(cfg.anneeScolaire)}</span><h1>Inscriptions fermées</h1></div>
    <div class="card">
      <span class="stamp closed"><span class="dot"></span>Fermées</span>
      <p style="margin-top:1rem;">${esc(S.status.message)}</p>
    </div>`;
  }
  if(S.inscConfirm){
    return `
    <div class="page-head"><span class="eyebrow">Inscriptions ${esc(cfg.anneeScolaire)}</span><h1>Dossier envoyé !</h1></div>
    <div class="card confirm-box">
      ${seal(56,false)}
      <h2 style="margin-top:1rem;">Votre demande a bien été enregistrée</h2>
      <p>Numéro de référence à conserver :</p>
      <div class="confirm-ref">${esc(S.inscConfirm)}</div>
      <p style="color:var(--muted);">L'équipe du ${esc(cfg.schoolName)} examinera votre dossier et mettra à jour son statut. Consultez la rubrique <strong>Suivi dossier</strong> à tout moment.</p>
      <button class="btn btn-outline" data-action="insc-reset">Déposer un autre dossier</button>
    </div>`;
  }
  const allSteps = getStepsWithCustom();
  const totalSteps = allSteps.length;
  const stepperHtml = allSteps.map((label,i)=>{
    const n = i+1;
    const done = n < S.inscStep;
    const active = n === S.inscStep;
    return `<div class="step-item">
      ${i>0?`<div class="step-line ${done||active?'done':''}"></div>`:''}
      <div class="step-circle ${done?'done':active?'active':''}">${done?'✓':n}</div>
      <span class="step-label ${active?'active':''}">${label}</span>
    </div>`;
  }).join('');

  let stepContent = '';
  if(S.inscStep === 1) stepContent = renderInscStep1();
  else if(S.inscStep === 2) stepContent = renderInscStep2();
  else if(S.inscStep === 3) stepContent = renderInscStep3();
  else if(S.inscStep === 4) stepContent = renderInscStep4();
  else if(S.inscStep === 5) stepContent = renderInscStep5();
  else if(S.inscStep === 6 && S.customFields.length > 0) stepContent = renderInscStep6();
  else stepContent = renderInscRecap(allSteps);

  return `
  <div class="page-head">
    <span class="eyebrow">Inscriptions ${esc(cfg.anneeScolaire)}</span>
    <h1>Dossier d'inscription — 6e</h1>
    <p style="color:var(--muted);">Destiné aux élèves actuellement en <strong>CM2</strong> souhaitant intégrer le ${esc(cfg.schoolName)} à la rentrée ${esc(cfg.anneeScolaire)}.</p>
  </div>
  <div class="stepper">${stepperHtml}</div>
  ${stepContent}`;
}

function renderInscStep6(){
  const fields = S.customFields;
  const d = S.inscData;
  const fieldsHtml = fields.map(f => {
    const fname = 'custom_' + f.id;
    let input = '';
    if(f.type === 'text') input = `<input type="text" name="${fname}" ${f.required?'required':''} value="${esc(d[fname]||'')}">`;
    else if(f.type === 'textarea') input = `<textarea name="${fname}" ${f.required?'required':''} rows="3">${esc(d[fname]||'')}</textarea>`;
    else if(f.type === 'select') {
      const opts = (f.options||'').split('\n').filter(o=>o.trim()).map(o=>`<option value="${esc(o.trim())}" ${d[fname]===o.trim()?'selected':''}>${esc(o.trim())}</option>`).join('');
      input = `<select name="${fname}" ${f.required?'required':''}><option value="">—</option>${opts}</select>`;
    } else if(f.type === 'checkbox') {
      input = `<label style="display:flex;align-items:center;gap:.5rem;font-weight:400;"><input type="checkbox" name="${fname}" style="width:auto;" ${d[fname]==='true'?'checked':''}> ${esc(f.label)}</label>`;
    } else if(f.type === 'file') {
      const existing = d[fname] ? `<div class="file-item"><span>${esc(d[fname])}</span><button type="button" data-action="clear-file" data-field="${fname}">×</button></div>` : '';
      input = `<div class="upload-area">
        <input type="file" id="file-${f.id}" data-field="${fname}" accept=".pdf,.jpg,.jpeg,.png">
        <label for="file-${f.id}">📎 Cliquez pour sélectionner un fichier (PDF, JPG, PNG)</label>
      </div>${existing}`;
    }
    return `<div class="field">
      <label>${esc(f.label)}${f.required?'<span class="required-star"> *</span>':''}</label>
      ${f.description?`<p class="hint">${esc(f.description)}</p>`:''}
      ${input}
    </div>`;
  }).join('');
  return `<div class="card"><form id="f-insc-step">
    <h2>Documents complémentaires</h2>
    <p class="hint" style="margin-bottom:1.25rem;">Ces champs ont été ajoutés par l'établissement. Veuillez les renseigner soigneusement.</p>
    ${fieldsHtml}
    <div style="display:flex;justify-content:space-between;gap:.75rem;margin-top:.5rem;">
      <button type="button" class="btn btn-outline" data-action="insc-prev">← Précédent</button>
      <button type="submit" class="btn btn-accent">Suivant →</button>
    </div>
  </form></div>`;
}

function renderAdmin(){
  const pending = S.accounts.filter(a=>a.status==='pending').length;
  const tabs = [
    {id:'comptes', label:`Comptes${pending>0?` <span class="badge-pending">${pending}</span>`:''}`},
    {id:'inscriptions', label:'Inscriptions'},
    {id:'actualites', label:'Actualités'},
    {id:'champs', label:'Champs personnalisés'},
    {id:'parametres', label:'Paramètres'}
  ];
  const tabBtns = tabs.map(t=>`<button class="${S.adminTab===t.id?'active':''}" data-admin-tab="${t.id}">${t.label}</button>`).join('');
  let content = '';
  if(S.adminTab==='comptes') content = renderAdminComptes();
  else if(S.adminTab==='inscriptions') content = renderAdminInscriptions();
  else if(S.adminTab==='actualites') content = renderActualites();
  else if(S.adminTab==='champs') content = renderAdminChamps();
  else content = renderAdminParametres();
  return `
  <div class="page-head"><span class="eyebrow">Espace réservé</span><h1>Administration</h1></div>
  <div class="admin-tabs">${tabBtns}</div>
  ${content}`;
}

function render(){
  const app = document.getElementById('app');
  if(S.page==='login'){ app.innerHTML = renderLogin(); return; }
  if(S.page==='signup'){ app.innerHTML = renderSignup(); return; }
  let content = '';
  if(S.appPage==='accueil') content = renderAccueil();
  else if(S.appPage==='actualites') content = renderActualites();
  else if(S.appPage==='inscriptions') content = renderInscriptions();
  else if(S.appPage==='suivi') content = renderSuivi();

    </div></footer>

}

function doLoginFamille(email, password){
  const acc = S.accounts.find(a=>a.email.toLowerCase()===email.toLowerCase());
  if(!acc){ S.loginError="Aucun compte trouvé pour cet e-mail. Veuillez créer un compte."; render(); return; }
  if(acc.status==='pending'){ S.loginError="Votre compte est en attente d'approbation par l'administration."; render(); return; }
  if(acc.status==='rejected'){ S.loginError="Votre compte a été refusé. Contactez l'établissement."; render(); return; }
  if(hashPw(password)!==acc.password){ S.loginError="Mot de passe incorrect."; render(); return; }
  S.session={id:acc.id,nom:acc.nom,prenom:acc.prenom,email:acc.email,role:'famille'};
  S.loginError=''; S.page='app'; S.appPage='accueil';
  DB.set('session',S.session); render();
}

function doLoginAdmin(nom, password){
  if(password!==S.config.adminPassword){ S.loginError="Mot de passe incorrect."; render(); return; }
  S.session={id:'admin',nom:nom||'Admin',prenom:'',email:'',role:'admin'};
  S.loginError=''; S.page='app'; S.appPage='accueil';
  DB.set('session',S.session); render();
}

function doSignup(nom, prenom, email, telephone, password, password2){
  if(!nom||!prenom||!email||!password){ S.signupError="Veuillez remplir tous les champs obligatoires."; render(); return; }
  if(password!==password2){ S.signupError="Les mots de passe ne correspondent pas."; render(); return; }
  if(password.length<6){ S.signupError="Le mot de passe doit contenir au moins 6 caractères."; render(); return; }
  if(S.accounts.find(a=>a.email.toLowerCase()===email.toLowerCase())){ S.signupError="Un compte existe déjà avec cet e-mail."; render(); return; }
  const acc={id:genId('acc'),nom,prenom,email,telephone,password:hashPw(password),status:'pending',createdAt:new Date().toISOString()};
  S.accounts.push(acc); save('accounts');
  S.signupDone=true; S.signupError=''; render();
}

function doLogout(){
  S.session=null; S.page='login'; S.appPage='accueil';
  S.mobNav=false; S.inscStep=1; S.inscData={}; S.inscConfirm=null;
  DB.del('session'); render();
}

function doSubmitInscStep(form){
  const data = new FormData(form);
  data.forEach((v,k)=>{ if(k!=='') S.inscData[k]=v.trim!==undefined?v.trim():v; });
  // Handle checkboxes
  form.querySelectorAll('input[type=checkbox]').forEach(cb=>{
    S.inscData[cb.name] = cb.checked?'true':'false';
  });
  const allSteps = getStepsWithCustom();
  if(S.inscStep < allSteps.length) S.inscStep++;
  render();
}

function doSubmitInscFinal(){
  const ref = genRef();
  const record = { ...S.inscData, id:genId('reg'), ref, status:'En attente', submittedAt:new Date().toISOString(), accountId:S.session.id };
  S.registrations.unshift(record); save('registrations');
  S.inscConfirm=ref; render();
}

function doSubmitNews(form, editId){
  const data=new FormData(form);
  const title=(data.get('title')||'').trim();
  const author=(data.get('author')||'').trim();
  const content=(data.get('content')||'').trim();
  if(!title||!content) return;
  if(editId){
    const it=S.news.find(n=>n.id===editId); if(it){it.title=title;it.author=author;it.content=content;it.date=new Date().toISOString();}
  } else {
    S.news.unshift({id:genId('n'),title,author,content,date:new Date().toISOString()});
  }
  save('news'); S.editNewsId=null; toast(editId?"Actualité modifiée.":"Actualité publiée.",'success');
}

function doSaveField(form){
  const data=new FormData(form);
  const label=(data.get('label')||'').trim();
  const type=data.get('type')||'text';
  const description=(data.get('description')||'').trim();
  const options=(data.get('options')||'').trim();
  const required=form.querySelector('[name=required]')&&form.querySelector('[name=required]').checked;
  if(!label) return;
  if(S.editFieldId==='new'){
    S.customFields.push({id:genId('cf'),label,type,description,options,required});
  } else {
    const f=S.customFields.find(x=>x.id===S.editFieldId);
    if(f){Object.assign(f,{label,type,description,options,required});}
  }
  save('customFields'); S.editFieldId=null; S.newFieldDraft=null;
  toast("Champ enregistré.",'success');
}

function exportCSV(){
  if(!S.registrations.length) return;
  const baseFields=[
    {key:'ref',label:'Référence'},{key:'status',label:'Statut'},{key:'submittedAt',label:'Date dépôt'},
    {key:'elevePrenom',label:'Prénom élève'},{key:'eleveNom',label:'Nom élève'},{key:'eleveNaissance',label:'Date naissance'},
    {key:'eleveLieuNaissance',label:'Lieu naissance'},{key:'eleveNationalite',label:'Nationalité'},
    {key:'eleveClasseActuelle',label:'Classe actuelle'},{key:'eleveEcole',label:'École'},{key:'eleveINE',label:'INE'},
    {key:'resp1Civilite',label:'Civ. Resp.1'},{key:'resp1Prenom',label:'Prénom Resp.1'},{key:'resp1Nom',label:'Nom Resp.1'},
    {key:'resp1Lien',label:'Lien Resp.1'},{key:'resp1Mobile',label:'Mobile Resp.1'},{key:'resp1Fixe',label:'Fixe Resp.1'},
    {key:'resp1Email',label:'Email Resp.1'},{key:'resp1Adresse',label:'Adresse Resp.1'},{key:'resp1CP',label:'CP Resp.1'},
    {key:'resp1Ville',label:'Ville Resp.1'},{key:'resp1Profession',label:'Profession Resp.1'},{key:'resp1SitFam',label:'Situation familiale'},
    {key:'resp2Prenom',label:'Prénom Resp.2'},{key:'resp2Nom',label:'Nom Resp.2'},{key:'resp2Mobile',label:'Mobile Resp.2'},{key:'resp2Email',label:'Email Resp.2'},
    {key:'lv1',label:'LV1'},{key:'lv2',label:'LV2'},{key:'regime',label:'Régime'},{key:'transport',label:'Transport'},
    {key:'retourSeul',label:'Retour seul'},{key:'options',label:'Options'},{key:'bilangue',label:'Bi-langues'},
    {key:'allergies',label:'Allergies'},{key:'allergiesDetail',label:'Détail allergies'},{key:'pai',label:'PAI'},
    {key:'traitement',label:'Traitement'},{key:'regimeAlim',label:'Régime alim.'},{key:'medecin',label:'Médecin'},
    {key:'urgenceNom',label:'Contact urgence'},{key:'urgenceTel',label:'Tél urgence'},{key:'remarques',label:'Remarques'}
  ];
  const customFields = S.customFields.map(f=>({key:'custom_'+f.id,label:f.label}));
  const allFields = [...baseFields,...customFields];
  const e = v => '"'+String(v??'').replace(/"/g,'""')+'"';
  const fdShort = iso => { try{const d=new Date(iso);return`${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;}catch(err){return '';} };
  const header = allFields.map(f=>e(f.label)).join(';');
  const rows = S.registrations.map(r=>allFields.map(f=>{
    const v=r[f.key];
    if(f.key==='submittedAt'||f.key==='eleveNaissance') return e(fdShort(v));
    return e(v);
  }).join(';'));
  const csv = '\uFEFF'+[header,...rows].join('\r\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url;
  const yr=(S.config.anneeScolaire||'').replace('-','_');
  a.download=`inscriptions_6e_${yr}_${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
  toast("CSV téléchargé — ouvrez-le avec LibreOffice Calc.",'success');
}

const app = document.getElementById('app');

app.addEventListener('click', e=>{
  const page = e.target.closest('[data-page]');
  if(page){ S.appPage=page.dataset.page; S.mobNav=false; S.editNewsId=null; S.editFieldId=null; if(page.dataset.adminTab) S.adminTab=page.dataset.adminTab; render(); return; }
  const atab = e.target.closest('[data-admin-tab]');
  if(atab){ S.adminTab=atab.dataset.adminTab; S.editNewsId=null; S.editFieldId=null; render(); return; }
  const ltab = e.target.closest('[data-login-tab]');
  if(ltab){ S.loginTab=ltab.dataset.loginTab; S.loginError=''; render(); return; }
  const action = e.target.closest('[data-action]');
  if(!action) return;
  const act=action.dataset.action, id=action.dataset.id;
  switch(act){
    case 'logout': doLogout(); break;
    case 'mob-nav': S.mobNav=!S.mobNav; render(); break;
    case 'goto-signup': S.page='signup'; S.signupDone=false; S.signupError=''; render(); break;
    case 'goto-login': S.page='login'; S.signupDone=false; render(); break;
    case 'insc-prev':
      if(S.inscStep>1) S.inscStep--;
      render(); break;
    case 'insc-reset': S.inscStep=1; S.inscData={}; S.inscConfirm=null; render(); break;
    case 'clear-suivi': S.suiviRef=''; S.suiviResult=null; render(); break;
    case 'toggle-status': S.status.open=!S.status.open; save('status'); toast(S.status.open?'Inscriptions ouvertes.':'Inscriptions fermées.','success'); break;
    case 'export-csv': exportCSV(); break;
    case 'new-news': S.editNewsId='new'; render(); break;
    case 'cancel-news': S.editNewsId=null; render(); break;
    case 'edit-news': S.editNewsId=id; render(); break;
    case 'del-news':
      if(confirm("Supprimer cette actualité ?")){S.news=S.news.filter(n=>n.id!==id);save('news');toast("Actualité supprimée.",'success');}
      break;
    case 'approve-account':{ const ac=S.accounts.find(a=>a.id===id); if(ac){ac.status='approved';save('accounts');toast("Compte approuvé.",'success');} break; }
    case 'reject-account':{ const ac=S.accounts.find(a=>a.id===id); if(ac){ac.status='rejected';save('accounts');toast("Compte désactivé.",'success');} break; }
    case 'del-account':
      if(confirm("Supprimer définitivement ce compte ?")){S.accounts=S.accounts.filter(a=>a.id!==id);save('accounts');toast("Compte supprimé.",'success');}
      break;
    case 'del-reg':
      if(confirm("Supprimer ce dossier définitivement ?")){S.registrations=S.registrations.filter(r=>r.id!==id);save('registrations');toast("Dossier supprimé.",'success');}
      break;
    case 'new-field': S.editFieldId='new'; S.newFieldDraft={}; render(); break;
    case 'cancel-field': S.editFieldId=null; render(); break;
    case 'edit-field': S.editFieldId=id; render(); break;
    case 'del-field':
      if(confirm("Supprimer ce champ personnalisé ?")){S.customFields=S.customFields.filter(f=>f.id!==id);save('customFields');toast("Champ supprimé.",'success');}
      break;
    case 'clear-file': S.inscData[action.dataset.field]=''; render(); break;
    case 'reset-all':
      if(confirm("Effacer toutes les données ? Cette action est irréversible.")){
        S.news=structuredClone(DEFS.news);S.registrations=[];S.accounts=[];S.customFields=[];S.status=structuredClone(DEFS.status);
        save('news');save('registrations');save('accounts');save('customFields');save('status');
        toast("Données réinitialisées.",'success');
      }
      break;
  }
});

app.addEventListener('change', e=>{
  const rs = e.target.closest('[data-action="set-reg-status"]');
  if(rs){ const r=S.registrations.find(x=>x.id===rs.dataset.id); if(r){r.status=rs.value;save('registrations');toast("Statut mis à jour.",'success');} return; }
  const fst = e.target.closest('[data-action="filter-st"]');
  if(fst){ S.filterSt=fst.value; render(); return; }
  // File input
  const fi = e.target.closest('input[type=file][data-field]');
  if(fi && fi.files.length){ S.inscData[fi.dataset.field]=fi.files[0].name; render(); }
});

app.addEventListener('input', e=>{
  const fq = e.target.closest('[data-action="filter-q"]');
  if(fq){ S.filterQ=fq.value; render(); }
});

app.addEventListener('submit', e=>{
  e.preventDefault();
  const form=e.target;
  if(form.id==='f-login-famille'){ doLoginFamille(form.elements.email.value, form.elements.password.value); return; }
  if(form.id==='f-login-admin'){ doLoginAdmin(form.elements.nom.value, form.elements.password.value); return; }
  if(form.id==='f-signup'){ doSignup(form.elements.nom.value,form.elements.prenom.value,form.elements.email.value,form.elements.telephone.value,form.elements.password.value,form.elements.password2.value); return; }
  if(form.id==='f-insc-step'){ doSubmitInscStep(form); return; }
  if(form.id==='f-insc-submit'){ doSubmitInscFinal(); return; }
  if(form.id==='f-news'){ doSubmitNews(form, form.dataset.id||null); return; }
  if(form.id==='f-suivi'){ const ref=form.elements.ref.value.trim().toUpperCase(); S.suiviRef=ref; S.suiviResult=S.registrations.find(r=>r.ref===ref)||'not-found'; render(); return; }
  if(form.id==='f-status-msg'){ S.status.message=form.elements.message.value; save('status'); toast("Message enregistré.",'success'); return; }
  if(form.id==='f-settings'){
    const d=new FormData(form);
    const sn=(d.get('schoolName')||'').trim(); if(sn) S.config.schoolName=sn;
    const an=(d.get('anneeScolaire')||'').trim(); if(an) S.config.anneeScolaire=an;
    const ct=(d.get('city')||'').trim(); S.config.city=ct;
    const pw=(d.get('adminPassword')||'').trim(); if(pw) S.config.adminPassword=pw;
    save('config'); toast("Paramètres enregistrés.",'success'); render(); return;
  }
  if(form.id==='f-field'){ doSaveField(form); render(); return; }
});

init();
</script>
</body>
</html>
